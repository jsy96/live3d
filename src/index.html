<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- Desktop: ignored. Phone browser: 1:1 layout, no double-tap zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- PWA: "Add to Home Screen" gives a standalone, chrome-less app icon.
       Desktop ignores these (file:// load just skips the missing files). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1c2436" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Live3D" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' live3d-model: blob: data: ws: wss:;"
  />
  <title>AI Live3D</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="panel" class="hidden">
    <div id="panel-title">AI Live3D 桌宠</div>
    <p>把 <b>.vrm</b> 模型放进项目的 <code>models/</code> 文件夹，或选择一个模型：</p>
    <div id="panel-buttons">
      <button id="pick-btn">从 models/ 目录选择</button>
      <button id="pick-file-btn">打开文件...</button>
    </div>
    <p id="panel-error"></p>
    <input id="file-input" type="file" accept=".vrm,.glb" />
  </div>

  <div id="bubble" class="hidden"></div>
  <div id="debug-badge" class="hidden"></div>

  <script type="module" src="../dist/bundle.js"></script>
</body>
</html>
